name: Checkmarx One Scan
on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main
      - master
      - develop
  push:
    branches:
      - main
      - master
      - develop
jobs:
  scan:                   
    name: Checkmarx One Security Scan     
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Checkmarx One CLI Action
        uses: checkmarx/ast-github-action@main #Github Action version
        with:
          project_name: rudy-marquez/juice-shop
          cx_tenant: ${{ secrets.CX_TENANT}}
          base_uri: https://deu.ast.checkmarx.net
          cx_client_id: ${{ secrets.CX_CLIENT_ID }}
          cx_client_secret: ${{ secrets.CX_CLIENT_SECRET }}
          SCAN_PARAMS: "--report-format sarif --output-path ."
          #additional_params: "--container-images michaelbraunbass/vulnado:main --scan-types container-security,sast"
      - name: Upload SARIF to GitHub
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: cx_result.sarif
